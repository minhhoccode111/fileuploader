root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate && go build -tags migrate -o ./tmp/app ./cmd/app"
  bin = "./dev-run.sh"
  include_ext = ["go", "templ", "env"]
  exclude_dir = ["tmp", "bin", "web/static", "web/plugins", ".git", "migrations"]
  exclude_regex = ["_templ.go", "_test.go"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true

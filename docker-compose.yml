x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fileuploader"
  POSTGRES_PASSWORD: "password"
  POSTGRES_USER: "user"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "file-uploader"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8090"
  HTTP_USE_PREFORK_MODE: "true"
  # Fake network latency
  HTTP_FAKE_LATENCY_MIN: "100ms"
  HTTP_FAKE_LATENCY_MAX: "200ms"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "10"
  PG_URL: "postgres://user:password@db:5432/fileuploader"
  # Redis
  REDIS_ADDR: "redis:6379"
  # MinIO
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "P@55w0rd"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "files"
  # The browser runs on the host, where the container name does not resolve.
  MINIO_PUBLIC_ENDPOINT: "localhost:9000"
  # Uploads
  UPLOAD_MAX_BYTES: "104857600"
  UPLOAD_TIMEOUT: "5m"
  # Global limits (zero means unlimited)
  STORAGE_DEFAULT_QUOTA_BYTES: "0"
  UPLOAD_DEFAULT_RATE_BYTES_PER_SEC: "0"
  DOWNLOAD_DEFAULT_RATE_BYTES_PER_SEC: "0"
  # Session
  SESSION_TTL: "24h"


services:
  db:
    container_name: db-fileuploader
    image: postgres:18.6-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  redis:
    container_name: redis-fileuploader
    image: redis:8.10.2-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      app_network:
        aliases:
          - redis.lvh.me

  minio:
    container_name: minio-fileuploader
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "P@55w0rd"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      app_network:
        aliases:
          - minio.lvh.me

  app:
    container_name: app-fileuploader
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8090:8090"
    depends_on:
      - db
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx-fileuploader
    image: nginx:1.31.3-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
  minio_data:
  redis_data:

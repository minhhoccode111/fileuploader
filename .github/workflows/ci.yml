name: CI
on:
  push:
    branches: [main]

jobs:
  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=15m

  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-yamllint@v1
        with:
          fail_level: error
          reporter: github-check
          yamllint_flags: '-d "{extends: default, rules: {truthy: disable}}" .'

  hadolint:
    name: runner / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-hadolint@v1
        with:
          fail_level: error
          reporter: github-check

  dotenv-linter:
    name: runner / dotenv-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dotenv-linter/action-dotenv-linter@v3
        with:
          reporter: github-check

  test:
    name: runner / go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Run tests
        run: go test -race ./...
      - name: Run shuffled tests
        run: go test -shuffle=on -count=5 ./...

  integration:
    name: runner / integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Start Postgres and MinIO
        run: docker compose -p fileuploader up -d db minio
      - name: Wait for Postgres
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -p fileuploader exec -T db pg_isready -U user
            then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run integration tests
        run: make test-integration
      - name: Stop services
        if: always()
        run: docker compose -p fileuploader down -v

  check-dependencies:
    name: runner / check-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27
      - name: WriteGoList
        run: go list -json -m all > go.list
      - name: Nancy
        uses: sonatype-nexus-community/nancy-github-action@main
        continue-on-error: true

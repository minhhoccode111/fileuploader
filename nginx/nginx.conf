http
{
    # The same identifier the app writes, so one request can be followed in
    # both logs.
    log_format with_request '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" request_id=$request_id';

    map $http_upgrade $connection_upgrade
    {
        default upgrade;
        '' close;
    }

    upstream app
    {
        server app:8090;
    }

    server
    {
        listen 80;
        server_name app.lvh.me;

        access_log /var/log/nginx/access.log with_request;

        # One upload is bounded by the app; leave room for the multipart
        # envelope on top of it.
        client_max_body_size 110m;
        location /
        {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}


events
{
    worker_connections 1024;
}
